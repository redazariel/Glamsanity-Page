<!-- FILE 4: admin.html -->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Glamsanity | Admin Dashboard</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="admin.css">

</head>


<body>

<div class="admin-layout">


    <aside class="sidebar">

        <div class="admin-logo">
            GLAM<span>SANITY</span>
        </div>

        <p class="admin-label">
            ADMIN PANEL
        </p>

        <nav>

            <button
                class="nav-button active"
                data-section="dashboard"
            >
                Dashboard
            </button>

            <button
                class="nav-button"
                data-section="products"
            >
                Products
            </button>

            <button
                class="nav-button"
                data-section="bundles"
            >
                Bundles
            </button>

            <button
                class="nav-button"
                data-section="containers"
            >
                Containers
            </button>

            <button
                class="nav-button"
                data-section="services"
            >
                Services
            </button>

            <button
                class="nav-button"
                data-section="settings"
            >
                Company Information
            </button>

            <button
                class="nav-button"
                data-section="payment"
            >
                Payment Information
            </button>

        </nav>


        <button
            id="themeToggle"
            class="sidebar-theme"
            type="button"
        >
            ☾ Light Mode
        </button>

    </aside>


    <main class="admin-main">


        <header class="admin-header">

            <div>

                <p class="eyebrow">
                    GLAMSANITY
                </p>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

            </div>

        </header>


        <!-- DASHBOARD -->

        <section
            id="dashboard"
            class="admin-section active"
        >

            <div class="stats-grid">

                <div class="stat-card">
                    <span>Products</span>
                    <strong id="productCount">0</strong>
                </div>

                <div class="stat-card">
                    <span>Bundles</span>
                    <strong id="bundleCount">0</strong>
                </div>

                <div class="stat-card">
                    <span>Containers</span>
                    <strong id="containerCount">0</strong>
                </div>

                <div class="stat-card">
                    <span>Services</span>
                    <strong id="serviceCount">0</strong>
                </div>

            </div>

        </section>


        <!-- PRODUCTS -->

        <section
            id="products"
            class="admin-section"
        >

            <div class="section-title">
                <h2>Products</h2>
            </div>

            <form
                id="productForm"
                class="admin-form"
            >

                <input
                    type="hidden"
                    id="productId"
                >

                <label>
                    Product Name

                    <input
                        type="text"
                        id="productName"
                        required
                    >
                </label>

                <label>
                    Description

                    <textarea
                        id="productDescription"
                        rows="4"
                    ></textarea>
                </label>

                <label>
                    Category

                    <input
                        type="text"
                        id="productCategory"
                        placeholder="Example: Makeup"
                    >
                </label>

                <label>
                    Price

                    <input
                        type="number"
                        id="productPrice"
                        min="0"
                        step="0.01"
                    >
                </label>

                <label>
                    Stock

                    <input
                        type="number"
                        id="productStock"
                        min="0"
                    >
                </label>

                <label>
                    Product Image

                    <input
                        type="file"
                        id="productImageFile"
                        accept="image/png,image/jpeg,image/jpg,image/webp,image/gif"
                    >
                </label>

                <div class="image-preview-box">
                    <img
                        id="productImagePreview"
                        class="image-preview hidden"
                        alt="Product preview"
                    >
                </div>

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="gold-button"
                    >
                        Save Product
                    </button>

                    <button
                        type="button"
                        id="cancelProduct"
                        class="secondary-button"
                    >
                        Clear
                    </button>

                </div>

            </form>


            <div
                id="adminProductsList"
                class="admin-items"
            ></div>

        </section>


        <!-- BUNDLES -->

        <section
            id="bundles"
            class="admin-section"
        >

            <div class="section-title">
                <h2>Bundles</h2>
            </div>

            <form
                id="bundleForm"
                class="admin-form"
            >

                <input
                    type="hidden"
                    id="bundleId"
                >

                <label>
                    Bundle Name

                    <input
                        type="text"
                        id="bundleName"
                        required
                    >
                </label>

                <label>
                    Description

                    <textarea
                        id="bundleDescription"
                        rows="4"
                    ></textarea>
                </label>

                <label>
                    Price

                    <input
                        type="number"
                        id="bundlePrice"
                        min="0"
                        step="0.01"
                    >
                </label>

                <label>
                    Stock

                    <input
                        type="number"
                        id="bundleStock"
                        min="0"
                    >
                </label>

                <label>
                    Bundle Image

                    <input
                        type="file"
                        id="bundleImageFile"
                        accept="image/png,image/jpeg,image/jpg,image/webp,image/gif"
                    >
                </label>

                <div class="image-preview-box">
                    <img
                        id="bundleImagePreview"
                        class="image-preview hidden"
                        alt="Bundle preview"
                    >
                </div>

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="gold-button"
                    >
                        Save Bundle
                    </button>

                    <button
                        type="button"
                        id="cancelBundle"
                        class="secondary-button"
                    >
                        Clear
                    </button>

                </div>

            </form>


            <div
                id="adminBundlesList"
                class="admin-items"
            ></div>

        </section>


        <!-- CONTAINERS -->

        <section
            id="containers"
            class="admin-section"
        >

            <div class="section-title">
                <h2>Containers</h2>
            </div>

            <form
                id="containerForm"
                class="admin-form"
            >

                <input
                    type="hidden"
                    id="containerId"
                >

                <label>
                    Container Name

                    <input
                        type="text"
                        id="containerName"
                        required
                    >
                </label>

                <label>
                    Description

                    <textarea
                        id="containerDescription"
                        rows="4"
                    ></textarea>
                </label>

                <label>
                    Price

                    <input
                        type="number"
                        id="containerPrice"
                        min="0"
                        step="0.01"
                    >
                </label>

                <label>
                    Stock

                    <input
                        type="number"
                        id="containerStock"
                        min="0"
                    >
                </label>

                <label>
                    Container Image

                    <input
                        type="file"
                        id="containerImageFile"
                        accept="image/png,image/jpeg,image/jpg,image/webp,image/gif"
                    >
                </label>

                <div class="image-preview-box">
                    <img
                        id="containerImagePreview"
                        class="image-preview hidden"
                        alt="Container preview"
                    >
                </div>

                <label>
                    Source

                    <input
                        type="text"
                        id="containerSource"
                        placeholder="Enter container source"
                    >

                    <small>
                        This information is visible only in the admin dashboard.
                    </small>
                </label>

                <div class="form-buttons">

                    <button
                        type="submit"
                        class="gold-button"
                    >
                        Save Container
                    </button>

                    <button
                        type="button"
                        id="cancelContainer"
                        class="secondary-button"
                    >
                        Clear
                    </button>

                </div>

            </form>


            <div
                id="adminContainersList"
                class="admin-items"
            ></div>

        </section>


        <!-- SERVICES -->

        <section
            id="services"
            class="admin-section"
        >

            <div class="section-title">
                <h2>Services Offered</h2>
            </div>

            <div
                id="servicesEditor"
                class="services-editor"
            ></div>

            <button
                id="saveServices"
                type="button"
                class="gold-button"
            >
                Save Services
            </button>

        </section>


        <!-- COMPANY INFORMATION -->

        <section
            id="settings"
            class="admin-section"
        >

            <div class="section-title">
                <h2>Company Information</h2>
            </div>

            <form
                id="companyForm"
                class="admin-form"
            >

                <label>
                    Company Introduction

                    <textarea
                        id="companyIntroInput"
                        rows="6"
                        placeholder="Write your company introduction..."
                    ></textarea>
                </label>

                <label>
                    Mission

                    <textarea
                        id="companyMissionInput"
                        rows="6"
                        placeholder="Write your company mission..."
                    ></textarea>
                </label>

                <label>
                    Vision

                    <textarea
                        id="companyVisionInput"
                        rows="6"
                        placeholder="Write your company vision..."
                    ></textarea>
                </label>

                <button
                    type="submit"
                    class="gold-button"
                >
                    Save Company Information
                </button>

            </form>

        </section>


        <!-- PAYMENT INFORMATION -->

        <section
            id="payment"
            class="admin-section"
        >

            <div class="section-title">
                <h2>Payment Information</h2>
            </div>

            <form
                id="paymentForm"
                class="admin-form"
            >

                <label>
                    Accepted Payment Methods

                    <textarea
                        id="paymentMethodsInput"
                        rows="4"
                        placeholder="Example: GCash, Maya, Bank Transfer..."
                    ></textarea>
                </label>

                <label>
                    Payment Instructions

                    <textarea
                        id="paymentInstructionsInput"
                        rows="5"
                        placeholder="Enter payment instructions..."
                    ></textarea>
                </label>

                <label>
                    Required Down Payment

                    <textarea
                        id="paymentDownPaymentInput"
                        rows="4"
                        placeholder="Example: 50% down payment is required..."
                    ></textarea>
                </label>

                <label>
                    Balance / Payment Schedule

                    <textarea
                        id="paymentScheduleInput"
                        rows="5"
                        placeholder="Enter balance and payment schedule..."
                    ></textarea>
                </label>

                <label>
                    Payment Confirmation Procedure

                    <textarea
                        id="paymentConfirmationInput"
                        rows="5"
                        placeholder="Explain how customers should confirm payments..."
                    ></textarea>
                </label>

                <label>
                    Important Payment Reminders

                    <textarea
                        id="paymentRemindersInput"
                        rows="5"
                        placeholder="Enter important reminders..."
                    ></textarea>
                </label>

                <button
                    type="submit"
                    class="gold-button"
                >
                    Save Payment Information
                </button>

            </form>

        </section>

    </main>

</div>


<div
    id="toast"
    class="toast"
></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>

</body>
</html>
