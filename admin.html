<!-- FILE 4: admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glamsanity Admin Dashboard</title>
  <link rel="stylesheet" href="admin.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="admin-header">
  <div class="admin-logo">GLAMSANITY ADMIN</div>

  <button id="themeToggle" class="theme-button">☾</button>

  <a href="index.html" class="view-site">View Store</a>
</header>

<div class="admin-layout">

<aside class="sidebar">
  <button class="nav-button active" data-section="dashboard">Dashboard</button>
  <button class="nav-button" data-section="products">Products</button>
  <button class="nav-button" data-section="bundles">Bundles</button>
  <button class="nav-button" data-section="containers">Pre-Order Containers</button>
  <button class="nav-button" data-section="services">Services Offered</button>
  <button class="nav-button" data-section="settings">Company & Payment</button>
</aside>

<main class="admin-main">

<section id="dashboard" class="admin-section active">
  <div class="section-title">
    <h1>Dashboard</h1>
    <p>Manage your Glamsanity store.</p>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <span>Products</span>
      <strong id="productCount">0</strong>
    </div>
    <div class="stat-card">
      <span>Bundles</span>
      <strong id="bundleCount">0</strong>
    </div>
    <div class="stat-card">
      <span>Containers</span>
      <strong id="containerCount">0</strong>
    </div>
    <div class="stat-card">
      <span>Services</span>
      <strong id="serviceCount">0</strong>
    </div>
  </div>
</section>

<section id="products" class="admin-section">
  <div class="section-title">
    <h1>Products</h1>
  </div>

  <form id="productForm" class="admin-form">
    <input type="hidden" id="productId">

    <label>Product Name
      <input id="productName" required>
    </label>

    <label>Description
      <textarea id="productDescription"></textarea>
    </label>

    <label>Category
      <input id="productCategory">
    </label>

    <label>Price
      <input id="productPrice" type="number" min="0" step="0.01">
    </label>

    <label>On-Hand / Available Stock
      <input id="productStock" type="number" min="0">
    </label>

    <label>Date Stock Was Checked
      <input id="productStockCheckedDate" type="date">
    </label>

    <label>Product Image
      <input id="productImageFile" type="file" accept="image/*">
    </label>

    <img id="productImagePreview" class="image-preview" alt="">

    <div class="form-buttons">
      <button class="gold-button" type="submit">Save Product</button>
      <button class="secondary-button" type="button" id="cancelProduct">Clear</button>
    </div>
  </form>

  <div id="adminProductsList" class="admin-list"></div>
</section>

<section id="bundles" class="admin-section">
  <div class="section-title">
    <h1>Bundles</h1>
  </div>

  <form id="bundleForm" class="admin-form">
    <input type="hidden" id="bundleId">

    <label>Bundle Name
      <input id="bundleName" required>
    </label>

    <label>Description
      <textarea id="bundleDescription"></textarea>
    </label>

    <label>Price
      <input id="bundlePrice" type="number" min="0" step="0.01">
    </label>

    <label>On-Hand / Available Stock
      <input id="bundleStock" type="number" min="0">
    </label>

    <label>Date Stock Was Checked
      <input id="bundleStockCheckedDate" type="date">
    </label>

    <label>Bundle Image
      <input id="bundleImageFile" type="file" accept="image/*">
    </label>

    <img id="bundleImagePreview" class="image-preview" alt="">

    <div class="form-buttons">
      <button class="gold-button" type="submit">Save Bundle</button>
      <button class="secondary-button" type="button" id="cancelBundle">Clear</button>
    </div>
  </form>

  <div id="adminBundlesList" class="admin-list"></div>
</section>

<section id="containers" class="admin-section">
  <div class="section-title">
    <h1>Pre-Order Containers</h1>
  </div>

  <form id="containerForm" class="admin-form">
    <input type="hidden" id="containerId">

    <label>Container Name
      <input id="containerName" required>
    </label>

    <label>Description
      <textarea id="containerDescription"></textarea>
    </label>

    <label>Price
      <input id="containerPrice" type="number" min="0" step="0.01">
    </label>

    <label>On-Hand / Available Stock
      <input id="containerStock" type="number" min="0">
    </label>

    <label>Date Stock Was Checked
      <input id="containerStockCheckedDate" type="date">
    </label>

    <label>Estimated Lead Time
      <input id="containerLeadTime" placeholder="e.g. 2–4 weeks">
    </label>

    <label>Container Image
      <input id="containerImageFile" type="file" accept="image/*">
    </label>

    <img id="containerImagePreview" class="image-preview" alt="">

    <label>Source <span class="admin-only">(Admin Only)</span>
      <input id="containerSource" placeholder="Supplier / Source">
    </label>

    <div class="form-buttons">
      <button class="gold-button" type="submit">Save Container</button>
      <button class="secondary-button" type="button" id="cancelContainer">Clear</button>
    </div>
  </form>

  <div id="adminContainersList" class="admin-list"></div>
</section>

<section id="services" class="admin-section">
  <div class="section-title">
    <h1>Services Offered</h1>
  </div>

  <div id="servicesEditor" class="services-editor"></div>

  <button id="addService" class="secondary-button">+ Add Service</button>
  <button id="saveServices" class="gold-button">Save Services</button>
</section>

<section id="settings" class="admin-section">
  <div class="section-title">
    <h1>Company Information</h1>
  </div>

  <form id="companyForm" class="admin-form">

    <label>Company Introduction
      <textarea id="companyIntroInput" rows="5"></textarea>
    </label>

    <label>Mission
      <textarea id="companyMissionInput" rows="4"></textarea>
    </label>

    <label>Vision
      <textarea id="companyVisionInput" rows="4"></textarea>
    </label>

    <button class="gold-button" type="submit">
      Save Company Information
    </button>
  </form>

  <div class="section-title">
    <h1>Mode of Payment</h1>
  </div>

  <form id="paymentForm" class="admin-form">

    <label>Accepted Payment Methods
      <textarea id="paymentMethodsInput"
        placeholder="GCash&#10;Bank Transfer&#10;Cash"></textarea>
    </label>

    <label>Payment Instructions
      <textarea id="paymentInstructionsInput"></textarea>
    </label>

    <label>Required Down Payment
      <textarea id="downPaymentInput"
        placeholder="e.g. 50% down payment"></textarea>
    </label>

    <label>Balance / Payment Schedule
      <textarea id="balanceScheduleInput"></textarea>
    </label>

    <label>Payment Confirmation Procedure
      <textarea id="confirmationProcedureInput"></textarea>
    </label>

    <label>Important Payment Reminders
      <textarea id="paymentRemindersInput"></textarea>
    </label>

    <label>Upload Mode of Payment Images
      <input id="paymentModeImagesInput" type="file" accept="image/*" multiple>
    </label>

    <div id="paymentModeImagePreview" class="uploaded-images"></div>

    <button class="gold-button" type="submit">
      Save Mode of Payment
    </button>
  </form>

  <div class="section-title">
    <h1>Rules & Policies</h1>
  </div>

  <form id="policyForm" class="admin-form">

    <label>Upload Rules & Policies Images
      <input id="policyImagesInput" type="file" accept="image/*" multiple>
    </label>

    <div id="policyImagePreview" class="uploaded-images"></div>

    <button class="gold-button" type="submit">
      Save Rules & Policies
    </button>
  </form>

</section>

</main>
</div>

<script src="admin.js"></script>
</body>
</html>
